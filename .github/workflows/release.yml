name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing over OIDC needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only used if trusted publishing is not set up. Leave the secret unset otherwise.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - id: version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v header="## $VERSION" '$0 == header { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section found for $VERSION"
            exit 1
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --verify-tag

      - name: Purge jsDelivr cache
        if: steps.changesets.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          major="${VERSION%%.*}"
          for tag in "$major" latest; do
            for file in dist/embed.js badges/*.svg; do
              url="https://purge.jsdelivr.net/npm/community-stellar-badge@${tag}/${file}"
              curl -fsS "$url" > /dev/null || echo "::warning::purge failed for $url"
            done
          done

      - name: Smoke test the live CDN
        if: steps.changesets.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base="https://cdn.jsdelivr.net/npm/community-stellar-badge@${VERSION}"
          for attempt in 1 2 3 4 5 6; do
            badge=$(curl -sS -o badge.svg -w '%{http_code} %{content_type}' "$base/badges/dark.svg")
            embed=$(curl -sS -o embed.js -w '%{http_code}' "$base/dist/embed.js")
            if [[ "$badge" == "200 image/svg+xml"* && "$embed" == "200" ]] \
              && [[ "$(head -c 4 badge.svg)" == "<svg" ]] \
              && grep -qF "/* community-stellar-badge v${VERSION} */" embed.js; then
              echo "cdn smoke test passed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed (badge: $badge, embed: $embed)"
            sleep $((attempt * 10))
          done
          echo "::error::cdn smoke test failed for $VERSION"
          exit 1
